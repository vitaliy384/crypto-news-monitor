name: Crypto News Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут
  workflow_dispatch:         # кнопка для ручного запуска

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore processed_news.json cache
        uses: actions/cache@v3
        with:
          path: processed_news.json
          key: processed-news-${{ github.run_id }}
          restore-keys: |
            processed-news-

      - name: Run monitor
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: Save processed_news.json for next runs
        uses: actions/cache@v3
        with:
          path: processed_news.json
          key: processed-news-${{ github.run_id }}
